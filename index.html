function dash(){if(!G||G.pause||G.p.dcd>0)return;const p=G.p,h=G.h;p.dash=.2;p.dcd=(h=='brakk'?4:h=='lira'?2.2:2.8)*(1-p.cdr);us();
 if(h=='lira'){kfx(120,.3);for(const e of kne(120))hurt(e,p.dm*2)}else if(h=='brakk')for(const e of kne(90)){e.sl=1.5;hurt(e,p.dm*3)}else p.hp=Math.min(p.mh,p.hp+p.mh*.03)}
function nova(){if(!kcd('ncd',9))return;const p=G.p,h=G.h,r=h=='lira'?280:h=='brakk'?260:300;kfx(r);for(const e of kne(r)){e.sl=h=='brakk'?2.5:3;if(h=='fen')e.pz=4;hurt(e,p.dm*(h=='lira'?2:h=='brakk'?3:1.5))}}
function rage(){if(!kcd('rcd',12))return;const p=G.p,h=G.h,r=h=='lira'?240:h=='brakk'?200:300;kfx(r);for(const e of kne(r)){if(h=='lira')hurt(e,p.dm*9);else if(h=='brakk'){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*120;e.y+=dy/d*120;hurt(e,p.dm*7)}else{e.pz=6;hurt(e,p.dm*1.2)}}}
function heal(){const h=G&&G.h;if(!kcd('hcd',h=='lira'?12:20))return;const p=G.p;if(h=='lira'){p.x+=p.ld.x*240;p.y+=p.ld.y*240;kfx(140,.4);for(const e of kne(140))hurt(e,p.dm*3)}else if(h=='brakk'){p.hp=Math.min(p.mh,p.hp+p.mh*.3);p.sh=Math.max(p.sh,2)}else p.hp=Math.min(p.mh,p.hp+p.mh*.55)}
function zap(){if(!kcd('fcd',7))return;const p=G.p,h=G.h;
 if(h=='brakk'){const s=[1,2,3].map(i=>({x:p.x+p.ld.x*100*i,y:p.y+p.ld.y*100*i}));p.x=s[2].x;p.y=s[2].y;p.dash=.25;for(const e of G.en)if(s.some(q=>Math.hypot(e.x-q.x,e.y-q.y)<90)){e.sl=2;hurt(e,p.dm*5)}kfx(130,.3);return}
 let c={x:p.x,y:p.y};for(const e of kn3(6)){G.ln.push({a:c,b:{x:e.x,y:e.y},l:.35});hurt(e,p.dm*(h=='fen'?3:4)*(G.wx=='rain'&&h=='lira'?1.5:1));if(h=='fen'){e.pz=5;p.hp=Math.min(p.mh,p.hp+p.mh*.02)}c={x:e.x,y:e.y}}}
function meteor(){if(!kcd('gcd',14))return;const p=G.p,h=G.h;
 if(h=='brakk'){const a=Math.atan2(p.ld.y,p.ld.x);kfx(380,.3);for(const e of kne(400)){let d=Math.abs(Math.atan2(e.y-p.y,e.x-p.x)-a);if(d>3.1416)d=6.283-d;if(d<.6){const dx=e.x-p.x,dy=e.y-p.y,m=Math.hypot(dx,dy)||1;e.x+=dx/m*80;e.y+=dy/m*80;hurt(e,p.dm*5)}}return}
 if(h=='fen'){for(const e of kn3(4))G.vn.push({x:e.x,y:e.y,l:5,t:0,r:90});return}
 const t=kne(500);for(let i=0;i<8;i++){const e=t[Math.floor(Math.random()*t.length)],a=Math.random()*6.283,r=Math.random()*200;G.mt.push({x:e?e.x:p.x+Math.cos(a)*r,y:e?e.y:p.y+Math.sin(a)*r,l:.7+i*.12})}}
function shield(){const h=G&&G.h;if(!kcd('zcd',h=='brakk'?18:16))return;const p=G.p;p.sh=h=='brakk'?6:h=='lira'?3:4;if(h=='fen')p.hp=Math.min(p.mh,p.hp+p.mh*.15)}
const tuo=h=>{S.tu=S.tu||{};return S.tu[h]=S.tu[h]||{hp:0,dm:0,sk:0}};
const TU={hp:['❤️ Máu',.4,'+10% máu tối đa mỗi cấp'],dm:['⚔️ Sức mạnh',.5,'+8% sát thương mỗi cấp'],sk:['✨ Kỹ năng',.6,'+8% sát thương skill, hồi chiêu −2% mỗi cấp']};
const tcost=(k,l)=>Math.round(TU[k][1]*Math.pow(1.35,l)*100)/100;
function tup(k){const u=tuo(sel),c=tcost(k,u[k]);if(u[k]>=20||S.tok<c)return;S.tok=Math.round((S.tok-c)*100)/100;u[k]++;save();menu()}
function tuH(){const u=tuo(sel);return`<h3>🔥 Lò luyện token — ${HE[sel].n}</h3>`+Object.keys(TU).map(k=>{const l=u[k],c=tcost(k,l);return`<div class="k"><span>${TU[k][0]} · Cấp ${l}/20<br><small>${TU[k][2]}</small></span><button ${l>=20||S.tok<c?'disabled':''} onclick="tup('${k}')">${l>=20?'Tối đa':'Nâng · '+c.toFixed(2)+' token'}</button></div>`}).join('')+'<p class="s">Đổi điểm → token ở phía trên (1.000 điểm = 1 token). Nâng cấp giữ vĩnh viễn cho nhân vật này ở mọi vùng. Chọn nhân vật khác để nâng cấp cho nhân vật đó.</p>'}
const SKW=f=>function(){const p=G&&G.p;if(!p)return f.apply(this,arguments);const o=p.dm;p.dm=o*(p.skm||1);try{return f.apply(this,arguments)}finally{p.dm=o}};
nova=SKW(nova);rage=SKW(rage);zap=SKW(zap);meteor=SKW(meteor);heal=SKW(heal);ult=SKW(ult);
invInit();aub();netInit();lobInit();menu();requestAnimationFrame(loop);
</script></body></html>
